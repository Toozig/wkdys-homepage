:root{
  --ink:#0F0F14; --text:#F4F4F8; --quiet:#CCD1E8; --rule:#2E2E3A;
  --violet:#8B6CFF; --lime:#C6FF3A;
  --sans:Rubik,system-ui,-apple-system,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.23,1,.32,1);
}
*{box-sizing:border-box}
html{background:var(--ink);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100svh;display:flex;flex-direction:column;
  background:var(--ink);color:var(--text);font:400 17px/26px var(--sans);
  font-kerning:normal;overflow-x:hidden}
p{margin:0}
main{flex:1;display:flex;flex-direction:column;justify-content:center;
  padding:clamp(40px,8vh,96px) max(24px,7vw)}
.inner{width:100%;max-width:720px;margin-inline:auto;position:relative;z-index:1}
.inner>*:not(.halo){position:relative;z-index:1}
.glow{position:fixed;border-radius:50%;filter:blur(90px);pointer-events:none;opacity:.5}
.g2{width:26vmax;aspect-ratio:1;background:#1A2416;inset-inline-end:-15vmax;bottom:-15vmax}
/* the light sits under the wordmark and throws up onto it */
.halo{position:absolute;z-index:0;pointer-events:none;
  inset-inline-start:calc(var(--lw) / 2);
  top:calc(var(--lw) / 2.684 * 0.80);
  width:min(980px,135vw);aspect-ratio:1;transform:translate(-50%,-50%);
  background:radial-gradient(circle closest-side,
    rgba(147,117,255,.52) 0%,
    rgba(143,113,254,.47) 8%,
    rgba(138,108,251,.41) 16%,
    rgba(132,102,246,.34) 24%,
    rgba(125,96,239,.28) 32%,
    rgba(118,89,231,.22) 40%,
    rgba(111,83,222,.165) 48%,
    rgba(104,78,213,.12) 56%,
    rgba(99,73,204,.08) 64%,
    rgba(94,69,196,.05) 72%,
    rgba(90,66,189,.028) 80%,
    rgba(87,63,184,.012) 88%,
    rgba(85,61,180,0) 100%);
  filter:blur(44px)}
:root[dir=rtl] .halo{transform:translate(50%,-42%)}
.inner{--lw:clamp(180px,34vw,300px)}
.logo{width:var(--lw);height:auto;display:block;position:relative;z-index:1}
.pron{font-size:13px;line-height:18px;color:var(--quiet);margin-top:14px}
.line{font-size:clamp(20px,3vw,27px);line-height:1.4;letter-spacing:-.005em;
  color:var(--quiet);margin-top:clamp(28px,5vh,46px);max-width:20em;text-wrap:pretty}
.line .hi{display:block;color:var(--violet);font-weight:500;
  font-size:clamp(24px,4vw,36px);line-height:1.3;letter-spacing:-.015em;margin-top:.25em}
.sub{font-size:15px;line-height:24px;color:var(--quiet);margin-top:18px;max-width:30em}
.rule{border:0;border-top:1px solid var(--violet);opacity:.55;margin:clamp(30px,5vh,48px) 0 0;max-width:340px}
.status{display:flex;align-items:center;gap:11px;margin-top:22px;
  font-size:11px;line-height:16px;font-weight:800;letter-spacing:.16em;
  text-transform:uppercase;color:var(--quiet)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--lime);flex:none;
  animation:pulse 3.2s var(--ease) infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.8)}}
.hello{display:inline-flex;align-items:center;justify-content:center;gap:9px;
  min-height:50px;padding:13px 30px;margin-top:clamp(26px,4vh,38px);
  border:0;border-radius:999px;background:var(--violet);color:var(--ink);
  font:500 16px/22px var(--sans);text-decoration:none;
  transition:background .25s var(--ease),transform .25s var(--ease)}
.hello:hover{background:#A996F5}
.hello:active{transform:scale(.98)}
.hello:focus-visible{outline:2px solid #fff;outline-offset:3px}
.hello svg{flex:none}
footer{padding:0 max(24px,7vw) clamp(28px,5vh,44px);position:relative;z-index:1}
.foot{max-width:720px;margin-inline:auto;display:flex;flex-wrap:wrap;gap:8px 26px;
  align-items:baseline;font-size:13px;line-height:20px;color:#7E7E96}
.foot a{color:var(--quiet);text-decoration:none;border-bottom:1px solid var(--rule);
  padding-bottom:2px;transition:color .25s var(--ease),border-color .25s var(--ease)}
.foot a:hover{color:var(--lime);border-color:var(--lime)}
.rv{opacity:0;transform:translateY(10px);animation:rise .9s var(--ease) forwards}
.rv:nth-child(2){animation-delay:.05s}
.rv:nth-child(3){animation-delay:.18s}
.rv:nth-child(4){animation-delay:.3s}
.rv:nth-child(5){animation-delay:.42s}
.rv:nth-child(6){animation-delay:.52s}
.rv:nth-child(7){animation-delay:.6s}
.rv:nth-child(8){animation-delay:.7s}
@keyframes rise{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  .rv{opacity:1;transform:none;animation:none}
  .dot{animation:none}
}
@media (max-width:640px){
  .glow{opacity:.42}
  .halo{filter:blur(30px)}
  .line{max-width:none}
}
</style>
</head>
<body>
<div class="glow g2" aria-hidden="true"></div>

<main>
